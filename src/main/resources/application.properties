spring.application.name=secure-notes-api

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/notes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema. Hibernate only verifies that the mapping matches it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# No default: the application must not start with a signing key that is public in this repository.
security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.access-expiration=${SECURITY_JWT_ACCESS_EXPIRATION:15m}
security.jwt.refresh-expiration=${SECURITY_JWT_REFRESH_EXPIRATION:24h}

security.rate-limit.enabled=${SECURITY_RATE_LIMIT_ENABLED:true}
security.rate-limit.requests-per-minute=${SECURITY_RATE_LIMIT_RPM:60}
security.rate-limit.auth-requests-per-minute=${SECURITY_RATE_LIMIT_AUTH_RPM:10}
security.rate-limit.trust-forwarded-for=${SECURITY_RATE_LIMIT_TRUST_XFF:false}

server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.SECURITY=INFO
