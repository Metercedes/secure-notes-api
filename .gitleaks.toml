[extend]
useDefault = true

# The test profile needs a syntactically valid signing key or the application context cannot
# start. The value below is Base64 of the literal string
# "test-only-signing-key-not-used-in-any-deployment-ok" and is never used outside the test
# source set. The production key has no default and must come from SECURITY_JWT_SECRET.
[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)[0-9a-z\-_\t .]{0,20}(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  paths = ['''src/test/resources/application\.properties''']
  regexTarget = "match"
  regexes = ['''dGVzdC1vbmx5LXNpZ25pbmcta2V5''']
